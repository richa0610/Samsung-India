[pytest]
# Tests live only in tests/, and only test_*.py files are test modules. pytest's defaults would also
# collect any "*_test.py" file anywhere under backend/ - e.g. scripts/seed_post_test.py - and import
# it before the tests/ safety guard runs, with the app's settings still pointing at the database
# named in .env.
testpaths = tests
python_files = test_*.py
# backend/ on sys.path whatever the import mode, so conftest.py can import the tests/ guard first.
pythonpath = .
