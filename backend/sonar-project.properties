# Project identity
sonar.projectKey=Samsung-Training-Backend
sonar.projectName=Samsung Training Backend

# Application source and tests
sonar.sources=app
sonar.tests=tests

sonar.host.url=http://localhost:9000

# Python configuration
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Exclude virtual environments, generated files and performance artifacts
sonar.exclusions=venv/**,**/__pycache__/**,**/*.pyc,media/**,perf/**,**/node_modules/**

# Identify test files
sonar.test.inclusions=tests/**/*.py
# Local server is slow to answer; the default 60s read timeout is too short
sonar.scanner.socketTimeout=300

# Local authentication token
sonar.token=sqa_bc133242b0301d4eb3c1b8de875c390494ea0a0a

# JGit can't read this repo's pack format ("Missing blob"), so skip blame
sonar.scm.disabled=true

sonar.python.coverage.reportPaths=coverage.xml