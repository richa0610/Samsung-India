services:
  - type: web
    name: samsung-india-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Same command run_prod.py wraps (reload off, 1 worker - see its
    # docstring for why: the rate limiter + WS registry hold in-memory
    # state that isn't safe to share across multiple workers/instances).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # Points at the Secret File uploaded in the Render dashboard (Settings
      # -> Secret Files) - Render mounts it at /etc/secrets/<filename>.
      - key: DB_SSL_CA
        value: /etc/secrets/aiven-ca.pem
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: ALLOW_ATTENDANCE_RETEST
        value: "false"
      - key: DEBUG
        value: "false"
      - key: FACE_DETECTION_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: ""
